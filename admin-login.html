<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#071952">
    <title>Admin Login | TIT CBT Portal</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 22px;
            font-family: "Segoe UI", Arial, sans-serif;
            background:
                radial-gradient(circle at 15% 15%, #08839533, transparent 30%),
                linear-gradient(135deg, #eef3fb, #f8fbff);
            color: #17213b;
        }

        .login-card {
            width: min(430px, 100%);
            padding: 34px;
            border: 1px solid #e2e9f3;
            border-radius: 24px;
            background: white;
            box-shadow: 0 25px 75px #07195218;
        }

        .logo {
            width: 58px;
            height: 58px;
            display: grid;
            place-items: center;
            margin-bottom: 22px;
            border-radius: 17px;
            color: white;
            font-size: 21px;
            font-weight: 800;
            background: linear-gradient(135deg, #071952, #088395);
        }

        h1 {
            margin: 0 0 8px;
            color: #071952;
            font-size: 25px;
        }

        .subtitle {
            margin: 0 0 26px;
            color: #728098;
            font-size: 13px;
            line-height: 1.7;
        }

        label {
            display: block;
            margin: 16px 0 7px;
            color: #34415d;
            font-size: 13px;
            font-weight: 700;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #dce5f0;
            border-radius: 11px;
            outline: none;
            font: inherit;
            font-size: 14px;
        }

        input:focus {
            border-color: #088395;
            box-shadow: 0 0 0 3px #08839518;
        }

        button {
            width: 100%;
            margin-top: 23px;
            padding: 14px;
            border: 0;
            border-radius: 11px;
            color: white;
            background: linear-gradient(110deg, #071952, #088395);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(1.08);
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            background: #fff0f0;
            color: #a32222;
            font-size: 13px;
            line-height: 1.7;
        }

        .hint {
            margin-top: 18px;
            color: #7a879c;
            font-size: 11px;
            line-height: 1.7;
        }

        .home-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #087f89;
            font-size: 13px;
            text-decoration: none;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>

<body>
    <main class="login-card">
        <div class="logo">TIT</div>
        <h1>Admin Portal</h1>
        <p class="subtitle">
            TECHNO INSTITUTE OF TECHNOLOGY<br>
            CBT Examination Management
        </p>

        <form id="adminLoginForm">
            <label for="adminUsername">Username</label>
            <input id="adminUsername" name="username" autocomplete="username" required>

            <label for="adminPassword">Password</label>
            <input id="adminPassword" name="password" type="password" autocomplete="current-password" required>

            <button type="submit">Secure Demo Login →</button>
        </form>

        <div id="loginMessage" class="message" role="alert" hidden></div>

        <p class="hint">
            Demo mode only: the credentials in admin-login.js are not secure for
            a real examination system. Replace this with server-side authentication
            before public deployment.
        </p>

        <a class="home-link" href="index.html">← Back to Home</a>
    </main>

    <script src="admin-login.js" defer></script>
</body>

</html>
